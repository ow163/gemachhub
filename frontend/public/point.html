<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>עמדת מתנדב – GemachHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>עמדת מתנדב</h1>
        <label>הנקודה שלי<select id="pt-point" aria-label="הנקודה שלי"></select></label>
      </section>

      <section class="card" id="pickups" aria-labelledby="pk-title">
        <h2 id="pk-title">איסופים להיום</h2>
        <table class="table" id="pk-table">
          <thead><tr><th>שעה</th><th>הזמנה</th><th>שואל</th><th>פריטים</th><th>סטטוס</th></tr></thead>
          <tbody><tr><td colspan="5" class="muted">טוען…</td></tr></tbody>
        </table>
      </section>

      <section class="card" id="handover" aria-labelledby="ho-title">
        <h2 id="ho-title">מסירת הזמנה</h2>
        <form class="inline-form" id="ho-form">
          <label class="grow">קוד הזמנה או טלפון<input name="query" placeholder="GH-1003 או 050-3333333" required /></label>
          <button type="submit">חיפוש</button>
          <button type="button" class="secondary" id="ho-scan" hidden>סריקת QR</button>
        </form>
        <video id="ho-video" class="scanner" hidden playsinline muted></video>
        <div id="ho-result" aria-live="polite"></div>
      </section>

      <section class="card" id="returns" aria-labelledby="rt-title">
        <h2 id="rt-title">קליטת החזרה</h2>
        <form class="inline-form" id="rt-form">
          <label class="grow">קוד הזמנה<input name="code" placeholder="GH-1001" required /></label>
          <button type="submit">טעינת ההזמנה</button>
        </form>
        <div id="rt-order" aria-live="polite"></div>
      </section>

      <dialog id="damage-dialog" aria-labelledby="dm-title">
        <form method="dialog" class="form" id="damage-form">
          <h2 id="dm-title">תיעוד נזק ביחידה <span id="dm-code"></span></h2>
          <label>דרגת חומרה<select name="severity" required>
            <option value="">בחרו דרגה</option><option value="light">קל</option><option value="medium">בינוני</option><option value="severe">חמור</option>
          </select></label>
          <label>תיאור הנזק<textarea name="description" required maxlength="500"></textarea></label>
          <label>תמונה של הנזק (חובה)<input name="photo_file" type="file" accept="image/*" capture="environment" required /></label>
          <p id="dm-msg" role="status" aria-live="polite"></p>
          <div class="actions-row"><button type="submit" value="save">שמירת הנזק</button><button type="button" class="secondary" id="dm-cancel">ביטול</button></div>
        </form>
      </dialog>
    </main>
    <footer class="footer">GemachHub · פרויקט בהנדסת תוכנה · אורי וינוגרד ורפאל זרוק</footer>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/point.js"></script>
    <script type="module" src="/js/returns.js"></script>
  </body>
</html>
