<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GemachHub – רשת גמ"חים קהילתית</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <div class="brand"><span class="logo" aria-hidden="true">ג</span><span>GemachHub</span></div>
        <h1>ציוד לכל שמחה ולכל צורך, בהשאלה מהשכונה</h1>
        <p>רשת גמ"חים קהילתית בירושלים: שולחנות וכיסאות לאירועים, ציוד לתינוקות, הגברה וציוד רפואי.</p>
        <span id="health" class="badge badge-checking" role="status"><span class="dot" aria-hidden="true"></span><span class="text">בודק חיבור לשרת…</span></span>
      </div>
    </header>

    <main class="grid">
      <!-- כל חבר צוות מוסיף בענף משלו אזור אחד שמבצע בקשה לבסיס הנתונים -->
      <!-- אזור הקטלוג (קריאה מבסיס הנתונים) - ענף feature/catalog-items -->
      <section class="card wide" id="catalog" aria-labelledby="catalog-title">
        <h2 id="catalog-title">קטלוג הציוד</h2>
        <div class="filters">
          <input id="catalog-search" type="search" placeholder="חיפוש פריט, למשל: מיחם" aria-label="חיפוש פריט" />
          <select id="catalog-category" aria-label="סינון לפי קטגוריה"><option value="">כל הקטגוריות</option></select>
        </div>
        <div class="items" id="catalog-items"><p class="muted">טוען…</p></div>
        <script type="module" src="/js/catalog.js"></script>
      </section>

      <section class="card" id="points" aria-labelledby="points-title">
        <h2 id="points-title">נקודות הגמ"ח</h2>
        <ul class="points" id="points-list"><li class="muted">טוען…</li></ul>
      </section>

      <!-- אזור הצעת תרומה (כתיבה לבסיס הנתונים) - ענף feature/donation-offer -->
    </main>

    <footer class="footer">GemachHub · פרויקט בהנדסת תוכנה · אורי וינוגרד ורפאל זרוק</footer>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
